const FASCIA_COL = {"Top": "#FFD700", "Semitop": "#00c3ff", "Ottimi titolari": "#2DB84A", "Buoni titolari": "#ff9900", "Jolly big": "#ff9900", "Titolari Low cost": "#aaa", "Low cost": "#aaa", "Jolly Low cost": "#888", "Ballottaggio porta": "#cc88ff", "Da evitare": "#ff4444"};

function fcol(f) {
  if (!f) return '#555';
  for (const [k,v] of Object.entries(FASCIA_COL)) {
    if (f.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return '#555';
}
function tcol(t) {
  return TAG_COL[t.toLowerCase()] || '#666';
}
function stars(v) {
  v = parseInt(v) || 0;
  return Array.from({length:5},(_,i)=>`<span style="color:${i<v?'#FFD700':'#333'};font-size:12px">★</span>`).join('');
}
function fmt(v, d=1) {
  if (v===null||v===undefined||v==='') return '—';
  if (typeof v==='number') return Number.isInteger(v)?v:v.toFixed(d);
  return v;
}

function getObj(name) {
  return localStorage.getItem('obj_'+name)==='1';
}
function setObj(name, val) {
  if (val) localStorage.setItem('obj_'+name,'1');
  else localStorage.removeItem('obj_'+name);
}

function showSheet(sh) {
  currentSheet = sh;
  sortCol = null; sortDir = 1;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.sheet===sh));
  applyFilters();
}

function filterFascia(btn, f) {
  currentFascia = f;
  document.querySelectorAll('.flt-btn').forEach(b => b.classList.remove('active'));

}

function toggleObjFilter() {
  objFilter = !objFilter;
  document.getElementById('btn-obj').classList.toggle('active', objFilter);
  applyFilters();
}

function applyFilters() {
  currentSearch = document.getElementById('search').value.toLowerCase().trim();
  renderTable();
}

function sortBy(col) {
  if (sortCol===col) sortDir=-sortDir; else { sortCol=col; sortDir=1; }
  renderTable();
}

function renderTable() {
  if (!currentSheet || !DATA[currentSheet]) return;
  let players = [...DATA[currentSheet]];

  if (currentFascia) players = players.filter(p => (p.Fascia||'').includes(currentFascia));
  if (currentSearch) players = players.filter(p =>
    (p.Nome||'').toLowerCase().includes(currentSearch) ||
    (p.Team||'').toLowerCase().includes(currentSearch) ||
    (p.Ruolo||'').toLowerCase().includes(currentSearch)
  );
  if (objFilter) players = players.filter(p => getObj(p.Nome));

  if (sortCol) {
    players.sort((a,b) => {
      let va=a[sortCol], vb=b[sortCol];
      if (va===null||va===undefined) va = sortDir>0?-Infinity:Infinity;
      if (vb===null||vb===undefined) vb = sortDir>0?-Infinity:Infinity;
      return (va<vb?-1:va>vb?1:0)*sortDir;
    });
  }

  const cont = document.getElementById('sheets-container');
  if (!players.length) {
    cont.innerHTML = '<div class="no-results">Nessun giocatore trovato</div>';
    return;
  }

  let html = '<table><thead><tr>';
  html += '<th style="width:30px"></th>';
  [['Nome','Nome'],['Team','Team'],['Ruolo','Ruolo'],['Fascia','Fascia'],
   ['Prezzo','Cred.'],['Quo','Quo'],['MV','MV'],['FMV','FMV'],['Presenze','Pres.'],
   ['Titolarità','Tit.'],['Affidabilità','Aff.'],['Integrità','Int.'],['','Tag']].forEach(([col,lbl])=>{
    if (!col) { html+=`<th>${lbl}</th>`; return; }
    const cls = sortCol===col ? (sortDir>0?'sorted-asc':'sorted-desc') : '';
    html+=`<th class="${cls}" onclick="sortBy('${col}')">${lbl}</th>`;
  });
  html += '</tr></thead><tbody>';

  players.forEach((p,i) => {
    const isObj = getObj(p.Nome);
    const fc = fcol(p.Fascia);
    const tags = (p.tags||[]).filter(Boolean);
    const tagHtml = tags.map(t=>{
      const c=tcol(t);
      return `<span class="tag" style="background:${c}22;color:${c};border:1px solid ${c}44">${t}</span>`;
    }).join('');
    const rid = 'r'+i+'_'+currentSheet.replace(/[^a-z]/gi,'');

    html += `<tr onclick="toggleExpand('${rid}')" class="${isObj?'obj-row':''}">`;
    html += `<td><span class="obj-star ${isObj?'on':''}" onclick="event.stopPropagation();toggleObj('${p.Nome}','${rid}_star')">★</span></td>`;
    html += `<td><span class="player-name">${p.Nome}</span></td>`;
    html += `<td><span class="team-badge">${p.Team||'—'}</span></td>`;
    html += `<td style="color:#888;font-size:12px">${p.Ruolo||'—'}</td>`;
    html += `<td><span class="fascia-badge" style="border-color:${fc}44;color:${fc};background:${fc}18">${p.Fascia||'—'}</span></td>`;
    html += `<td class="price">${fmt(p.Prezzo)}</td>`;
    html += `<td class="quo">${fmt(p.Quo)}</td>`;
    html += `<td style="color:#c8c8c8">${fmt(p.MV)}</td>`;
    html += `<td style="color:#c8c8c8">${fmt(p.FMV)}</td>`;
    html += `<td style="color:#888">${fmt(p.Presenze,0)}</td>`;
    html += `<td class="stars-cell">${stars(p['Titolarità'])}</td>`;
    html += `<td class="stars-cell">${stars(p['Affidabilità'])}</td>`;
    html += `<td class="stars-cell">${stars(p['Integrità'])}</td>`;
    html += `<td>${tagHtml}</td>`;
    html += '</tr>';

    // riga espansa
    html += `<tr class="expand-row" id="${rid}"><td colspan="14">
    <div class="expand-inner">
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val">${fmt(p.MV)}</div><div class="stat-lbl">MV</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.FMV)}</div><div class="stat-lbl">FMV</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p['FMV Exp.'])}</div><div class="stat-lbl">FMV Exp.</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.Presenze,0)}</div><div class="stat-lbl">Presenze</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p['Pt. Tit.'],0)}</div><div class="stat-lbl">Pt. Tit.</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.Minuti,0)}</div><div class="stat-lbl">Minuti</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.Gol,0)}</div><div class="stat-lbl">Gol</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.Assist,0)}</div><div class="stat-lbl">Assist</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.Ammonizioni,0)}</div><div class="stat-lbl">Amm.</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p.Espulsioni,0)}</div><div class="stat-lbl">Esp.</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p['Rig. Segnati'],0)}</div><div class="stat-lbl">Rig. Seg.</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p['Rig. Sbagliati'],0)}</div><div class="stat-lbl">Rig. Sbag.</div></div>
        ${(p['Gol Subiti']!==null&&p['Gol Subiti']!==undefined)?`<div class="stat-box"><div class="stat-val">${fmt(p['Gol Subiti'],0)}</div><div class="stat-lbl">Gol Sub.</div></div>`:''}
        ${(p['Rig. Parati']!==null&&p['Rig. Parati']!==undefined)?`<div class="stat-box"><div class="stat-val">${fmt(p['Rig. Parati'],0)}</div><div class="stat-lbl">Rig. Par.</div></div>`:''}
        <div class="stat-box"><div class="stat-val">${p.PMA||'—'}</div><div class="stat-lbl">PMA</div></div>
        <div class="stat-box"><div class="stat-val">${fmt(p['Pt. Inf.'],0)}</div><div class="stat-lbl">Pt. Inf.</div></div>
      </div>
      ${p.Commento?`<div class="commento">💬 ${p.Commento}</div>`:''}
      ${tagHtml?`<div class="tags-row" style="margin-top:8px">${tagHtml}</div>`:''}
    </div></td></tr>`;
  });

  html += '</tbody></table>';
  cont.innerHTML = html;
}

function toggleExpand(rid) {
  const row = document.getElementById(rid);
  if (!row) return;
  row.classList.toggle('open');
}

function toggleObj(name, starId) {
  const cur = getObj(name);
  setObj(name, !cur);
  applyFilters();
}

async function pubblicaGH() {
  let token = localStorage.getItem('gh_token') || prompt('GitHub Token PAT:');
  if (!token) return;
  localStorage.setItem('gh_token', token);

  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const b64 = await new Promise((res,rej)=>{
    const blob = new Blob([html],{type:'text/plain'});
    const reader = new FileReader();
    reader.onloadend = ()=>res(reader.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(blob);
  });

  // Recupera SHA attuale
  let sha = '';
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      headers: {'Authorization':'token '+token}
    });
    if (r.ok) { const d=await r.json(); sha=d.sha; }
  } catch(e) {}

  const body = {message:`Aggiornate fasce (${GH_FILE})`,content:b64};
  if (sha) body.sha = sha;

  const resp = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
    method:'PUT', headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if (resp.ok) alert('✅ Caricato su GitHub!');
  else alert('❌ Errore: '+resp.status+' '+await resp.text());
}

// Nasconde bottone GitHub se non in locale
if (location.protocol !== 'file:') {
  document.querySelector('.tb-btn.green').style.display='none';
}
