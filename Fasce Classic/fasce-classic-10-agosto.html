*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:#111;border-bottom:1px solid #222;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap;flex-shrink:0}
.toolbar-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#b0ff00;flex:1;min-width:120px}
.tb-btn{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.tb-btn:hover{background:#252525}
.tb-btn.primary{background:#b0ff00;color:#000;border-color:#b0ff00}
.tb-btn.primary:hover{background:#90d900}
.page-header{padding:12px 16px 8px;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.page-title{font-size:20px;font-weight:700;letter-spacing:1px}
.page-sub{font-size:11px;color:#aaa;margin-top:2px}
.tabs{display:flex;padding:0 16px;background:#111;border-bottom:1px solid #1e1e1e;overflow-x:auto;flex-shrink:0}
.tab-btn{padding:10px 18px;background:none;border:none;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab-btn.active{color:#fff;border-bottom-color:#b0ff00}
.tab-btn:hover:not(.active){color:#ddd}
.tab-count{font-size:11px;background:#222;color:#aaa;padding:1px 6px;border-radius:10px;margin-left:5px}
.tab-btn.active .tab-count{background:#b0ff0022;color:#b0ff00}
.controls{padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.search-box{background:#111;border:1px solid #2a2a2a;color:#fff;padding:6px 12px;border-radius:4px;font-size:13px;width:200px;outline:none}
.search-box::placeholder{color:#666}
.search-box:focus{border-color:#444}
.fascia-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ff-btn{padding:4px 10px;border-radius:3px;border:1px solid;font-size:11px;font-weight:700;cursor:pointer;background:transparent;opacity:.7;transition:all .15s;white-space:nowrap}
.ff-btn.active,.ff-btn:hover{opacity:1}
.ff-btn.all-btn{color:#fff;border-color:#444;background:#1a1a1a}
.ff-btn.all-btn.active{background:#333}
.stats-info{padding:3px 16px 5px;font-size:11px;color:#555;flex-shrink:0}
.table-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:#111;color:#888;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;text-align:left;border-bottom:2px solid #222;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
thead th:hover{color:#fff}
thead th.sorted{color:#b0ff00}
tbody tr{border-bottom:1px solid #181818;cursor:pointer;transition:background .1s}
tbody tr:hover{background:#151515}
tbody tr.target-row{border-left:3px solid #b0ff00}
tbody tr.expanded-row{background:#131313}
td{padding:8px 10px;font-size:13px;color:#fff;vertical-align:middle;white-space:nowrap}
.team-badge{display:inline-block;background:#1e1e1e;border:1px solid #2a2a2a;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;min-width:36px;text-align:center}
.fascia-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;white-space:nowrap}
.tags-wrap{display:flex;flex-wrap:nowrap;gap:4px;overflow:hidden}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;white-space:nowrap;border:1px solid}
.star-group{display:flex;gap:6px;align-items:center}
.star-col{display:flex;flex-direction:column;align-items:center;gap:1px}
.star-lbl{font-size:8px;color:#666;text-transform:uppercase;letter-spacing:.3px}
.star-val{font-size:11px;letter-spacing:-1px}
.target-star{font-size:16px;cursor:pointer;user-select:none;transition:transform .1s}
.target-star:hover{transform:scale(1.3)}
.commento-txt{font-size:11px;color:#ff8800;font-style:italic}
.budget-pct{font-size:12px;font-weight:700;color:#b0ff00}
.budget-pct.low{color:#fff}
.detail-row td{background:#111;padding:0;white-space:normal}
.detail-inner{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.detail-item{display:flex;flex-direction:column;gap:2px}
.detail-lbl{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.4px}
.detail-val{font-size:14px;font-weight:700;color:#fff}
.detail-section{grid-column:1/-1;font-size:10px;font-weight:700;letter-spacing:1px;color:#444;text-transform:uppercase;border-top:1px solid #1e1e1e;padding-top:8px;margin-top:4px}
.no-results{text-align:center;padding:40px;color:#555;font-size:14px}
.status-bar{position:fixed;bottom:16px;right:16px;background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;display:none;z-index:999}
.status-bar.show{display:block}

@media(max-width:768px){
  body{height:auto;overflow:auto}
  .table-wrap{flex:none;overflow-x:auto;max-height:none}
  thead th{position:static}
  td,th{padding:6px 8px;font-size:12px;white-space:nowrap}
  .search-box{width:100%}
  table{min-width:900px}
}
@media(max-width:480px){
  td,th{padding:5px 6px;font-size:11px}
  table{min-width:900px}
}

</style>

  {key:'_stars',label:'T · A · I',sort:false,cls:'col-stars'},
  {key:'FMV',label:'FMV',sort:true,cls:'col-fmv'},
  {key:'Commento',label:'Note',sort:false,cls:'col-comm'},
  {key:'_expand',label:'',sort:false,cls:'col-expand'},
];
function init(){
  document.getElementById('tot-count').textContent=Object.values(DATA).reduce((s,a)=>s+a.length,0);
  buildTabs();buildFasciaFilters();buildHeader();render();
}
function buildTabs(){
  document.getElementById('tabs').innerHTML=Object.keys(DATA).map(r=>
    `<button class="tab-btn${r===currentTab?' active':''}" onclick="switchTab('${r}')">
    ${ROLE_LABEL[r]||r}<span class="tab-count">${DATA[r].length}</span></button>`).join('');
}
function buildFasciaFilters(){
  const ex=new Set(Object.values(DATA).flat().map(p=>p['Fascia']));
  const ord=FASCIA_ORDER.filter(f=>ex.has(f));
  document.getElementById('fascia-filters').innerHTML=
    `<button class="ff-btn all-btn${!currentFascia?' active':''}" onclick="filterFascia(null)">Tutti</button>`+
    ord.map(f=>{const c=FASCIA_COLOR[f]||'#888';
      return `<button class="ff-btn${currentFascia===f?' active':''}" style="color:${c};border-color:${c}44;background:${currentFascia===f?c+'22':'transparent'}" onclick="filterFascia('${f}')">${f}</button>`;
    }).join('');
}
function buildHeader(){
  document.getElementById('thead').innerHTML='<tr>'+COLS.map(c=>{
    const arrow=c.sort?`<span style="margin-left:3px;opacity:${c.key===sortCol?1:.4}">${c.key===sortCol?(sortDir>0?'▲':'▼'):'⇅'}</span>`:'';
    return `<th class="${c.cls||''}${c.key===sortCol?' sorted':''}" onclick="${c.sort?`doSort('${c.key}')`:''}">
    ${c.label}${arrow}</th>`;
  }).join('')+'</tr>';
}
function getPlayers(){
  let pl=DATA[currentTab]||[];
  if(currentFascia) pl=pl.filter(p=>p['Fascia']===currentFascia);
  if(searchQuery) pl=pl.filter(p=>(p['Nome']||'').toLowerCase().includes(searchQuery)||(p['Team']||'').toLowerCase().includes(searchQuery));
  if(sortCol) pl=[...pl].sort((a,b)=>{
    let va=a[sortCol]??'',vb=b[sortCol]??'';
    return(typeof va==='number'&&typeof vb==='number')?(va-vb)*sortDir:String(va).localeCompare(String(vb))*sortDir;
  });
  return pl;
}
function fmtBudget(v){
  if(v===''||v===null||v===undefined) return '—';
  const n=parseFloat(String(v).replace(',','.'));
  return isNaN(n)||n===0?'—':(Math.round(n*10)/10)+'%';
}
function render(){
  const players=getPlayers();
  const tbody=document.getElementById('tbody');
  const noRes=document.getElementById('no-results');
  if(!players.length){tbody.innerHTML='';noRes.style.display='block';return;}
  noRes.style.display='none';
  function sStar(v){const n=parseInt(v)||0;return'<span style="color:#FFD700">'+('★').repeat(n)+'</span>'+'<span style="color:#2a2a2a">'+('★').repeat(5-n)+'</span>';}
  let html='';
  players.forEach(p=>{
    const id=p['_id'],isTgt=targets.has(id),isExp=expanded.has(id);
    const fc=FASCIA_COLOR[p['Fascia']]||'#888';
    const prezzo=p['Prezzo']===''||p['Prezzo']===0?'—':p['Prezzo'];
    const fmv=p['FMV']!==''&&p['FMV']!==0?Number(p['FMV']).toFixed(2):'—';
    const budget=fmtBudget(p['Budget']);
    const budgetHigh=budget!=='—'&&parseFloat(budget)>=8;
    const tagsHtml=(p['_tags']||[]).map(t=>{const tc=TAG_COLOR[t.toLowerCase()]||'#aaa';
      return `<span class="tag" style="color:${tc};border-color:${tc}44;background:${tc}18">${t}</span>`;
    }).join('');
    const starsHtml=`<div class="star-group">
      <div class="star-col"><div class="star-lbl">T</div><div class="star-val">${sStar(p['Titolarità'])}</div></div>
      <div class="star-col"><div class="star-lbl">A</div><div class="star-val">${sStar(p['Affidabilità'])}</div></div>
      <div class="star-col"><div class="star-lbl">I</div><div class="star-val">${sStar(p['Integrità'])}</div></div>
    </div>`;
    html+=`<tr class="${isTgt?'target-row':''}${isExp?' expanded-row':''}" onclick="toggleExpand('${id}')">
      <td class="col-star" onclick="event.stopPropagation()"><span class="target-star" onclick="toggleTarget('${id}')">${isTgt?'⭐':'☆'}</span></td>
      <td class="col-nome"><strong>${p['Nome']}</strong></td>
      <td class="col-team"><span class="team-badge">${p['Team']}</span></td>
      <td class="col-fascia"><span class="fascia-badge" style="background:${fc}22;color:${fc};border:1px solid ${fc}44">${p['Fascia']}</span></td>
      <td class="col-tags"><div class="tags-wrap">${tagsHtml}</div></td>
      <td class="col-prezzo" style="text-align:right;font-weight:700">${prezzo}</td>
      <td class="col-budget" style="text-align:right"><span class="budget-pct${budgetHigh?'':' low'}">${budget}</span></td>
      <td class="col-quo" style="text-align:center">${p['Quo']||'—'}</td>
      <td class="col-stars">${starsHtml}</td>
      <td class="col-fmv" style="text-align:right;font-weight:600;color:${fmv!=='—'&&Number(fmv)>=6?'#b0ff00':'#fff'}">${fmv}</td>
      <td class="col-comm">${p['Commento']?`<span class="commento-txt">${p['Commento']}</span>`:''}</td>
      <td class="col-expand" style="color:#555;text-align:center">${isExp?'▲':'▼'}</td>
    </tr>`;
    if(isExp){
      const d=[
        {l:'MV',v:p['MV']!==''?Number(p['MV']).toFixed(2):'—'},
        {l:'FMV',v:p['FMV']!==''?Number(p['FMV']).toFixed(2):'—'},
        {l:'FMV Exp.',v:p['FMV Exp.']!==''?Number(p['FMV Exp.']).toFixed(2):'—'},
        {l:'Presenze',v:p['Presenze']||'—'},{l:'Minuti',v:p['Minuti']||'—'},
        {l:'Gol',v:p['Gol']!==''?p['Gol']:'—'},{l:'Assist',v:p['Assist']!==''?p['Assist']:'—'},
        {l:'Amm.',v:p['Ammonizioni']!==''?p['Ammonizioni']:'—'},{l:'Esp.',v:p['Espulsioni']!==''?p['Espulsioni']:'—'},
        {l:'Rig. Seg.',v:p['Rig. Segnati']!==''?p['Rig. Segnati']:'—'},
        {l:'Rig. Sbag.',v:p['Rig. Sbagliati']!==''?p['Rig. Sbagliati']:'—'},
        {l:'Gol Subiti',v:p['Gol Subiti']!==''?p['Gol Subiti']:'—'},
        {l:'Rig. Parati',v:p['Rig. Parati']!==''?p['Rig. Parati']:'—'},
        {l:'PMA',v:p['PMA']||'—'},{l:'Pt. Tit.',v:p['Pt. Tit.']||'—'},{l:'Pt. Inf.',v:p['Pt. Inf.']||'—'},
      ];
      html+=`<tr class="detail-row"><td colspan="${COLS.length}"><div class="detail-inner">
        <div class="detail-section">Statistiche 2025-26</div>
        ${d.map(x=>`<div class="detail-item"><div class="detail-lbl">${x.l}</div><div class="detail-val">${x.v}</div></div>`).join('')}
      </div></td></tr>`;
    }
  });
  tbody.innerHTML=html;
  document.getElementById('table-wrap').scrollTop=0;
  const tgt=players.filter(p=>targets.has(p['_id'])).length;
  document.getElementById('stats-info').textContent=`${players.length} giocatori${tgt?' · '+tgt+' obiettivi':''} · clicca riga per statistiche`;
}
function switchTab(r){currentTab=r;currentFascia=null;searchQuery='';document.getElementById('search').value='';expanded.clear();sortCol=null;buildTabs();buildFasciaFilters();buildHeader();render();}
function filterFascia(f){currentFascia=f;expanded.clear();buildFasciaFilters();render();}
function onSearch(q){searchQuery=q.toLowerCase().trim();render();}
function doSort(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}buildHeader();render();}
function toggleExpand(id){expanded.has(id)?expanded.delete(id):expanded.add(id);render();}
function toggleTarget(id){targets.has(id)?targets.delete(id):targets.add(id);localStorage.setItem(TARGET_KEY,JSON.stringify([...targets]));render();}
function salvaLocale(){
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  try{window.showSaveFilePicker({suggestedName:FNAME,types:[{description:'HTML',accept:{'text/html':['.html']}}]}).then(fh=>fh.createWritable()).then(w=>{w.write(blob);w.close();});}
  catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=FNAME;a.click();}
}
async function pubblicaGitHub(){
  let token=localStorage.getItem('gh_token')||prompt('Token GitHub (ghp_...)');
  if(!token)return;
  localStorage.setItem('gh_token',token);
  showStatus('⏳ Pubblicazione in corso...');
  try{
    const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(new Blob([html],{type:'text/plain'}));});
    const headers={'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json'};
    const get=await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(GH_PATH).replace(/%2F/g,'/')}`,{headers});
    let sha=null;if(get.ok){const j=await get.json();sha=j.sha;}
    const body={message:'Fasce Classic aggiornate',content:b64};if(sha)body.sha=sha;
    const put=await fetch(`https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(GH_PATH).replace(/%2F/g,'/')}`,{method:'PUT',headers,body:JSON.stringify(body)});
    if(put.ok)showStatus('✓ Pubblicato su GitHub!',true);
    else{const e=await put.json();showStatus('✗ '+e.message,false);}
  }catch(e){showStatus('✗ '+e.message,false);}
}
function showStatus(msg,ok){
  const el=document.getElementById('status');
  el.innerHTML=`<span style="color:${ok===true?'#b0ff00':ok===false?'#ff4444':'#fff'}">${msg}</span>`;
  el.classList.add('show');if(ok!==undefined)setTimeout(()=>el.classList.remove('show'),3500);
}
init();
</script></body></html>
